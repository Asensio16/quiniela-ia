name: Actualizar Quiniela IA

on:
  schedule:
    - cron: "17 */3 * * *" # cada 3 horas
  workflow_dispatch: # botón "Run workflow" para actualizar a mano

permissions:
  contents: write # para guardar docs/quiniela.json en el repositorio

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Caché de fichas de partido (los partidos terminados no cambian)
        uses: actions/cache@v4
        with:
          path: .cache
          key: fichas-${{ github.run_id }}
          restore-keys: fichas-
      - run: npm test
      - name: Generar pronóstico
        run: npm run generate
        env:
          # Opcionales: sin clave la web funciona igual, con textos automáticos
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar y publicar
        run: |
          git config user.name "quiniela-ia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/quiniela.json
          git diff --cached --quiet || (git commit -m "Actualizar pronóstico" && git push)
