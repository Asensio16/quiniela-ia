<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiniela IA · Estanco Nº5 Águilas</title>
<meta name="description" content="Pronósticos de La Quiniela con modelo estadístico: rachas, goles, bajas y goleadores.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --panel:#121a33; --panel2:#18224a; --line:#26335f; --text:#eef2ff; --muted:#9aa6cf;
  --green:#3dff8b; --yellow:#ffd23f; --blue:#4cc9ff; --red:#ff5d6c; --pink:#ff7ad9;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#16225a 0,var(--bg) 60%) fixed,var(--bg);color:var(--text);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:980px;margin:0 auto}
.display{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.04em}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace}
header{text-align:center;padding:28px 0 8px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
h1{margin:10px 0 0;font-size:clamp(52px,11vw,96px);line-height:.95;color:var(--green);text-shadow:0 0 28px rgba(61,255,139,.45)}
h1 span{color:var(--yellow)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;min-width:120px}
.chip b{display:block;font-size:26px;line-height:1.05}
.chip small{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:18px auto 6px;max-width:560px}
.seg button{flex:1;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:12px 10px;cursor:pointer;min-height:48px}
.seg button[aria-pressed=true]{background:linear-gradient(90deg,var(--green),var(--blue));color:#04101f}
.seghint{text-align:center;color:var(--muted);font-size:13px;margin:0 auto 14px;max-width:640px}

.ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ticket h2,.sec h2{margin:0 0 10px;font-size:24px}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media(min-width:480px){.cells{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}}
@media(min-width:700px){.cells{grid-template-columns:repeat(15,minmax(0,1fr))}}
.cell{aspect-ratio:1/1.15;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cell i{position:absolute;top:3px;left:5px;font-style:normal;font-size:10px;color:var(--muted)}
.cell b{font-size:24px;line-height:1}
.cell em{font-style:normal;font-size:11px;color:var(--muted)}
.cell.s1 b{color:var(--green)} .cell.sX b{color:var(--yellow)} .cell.s2 b{color:var(--blue)}
.cell.gem{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset,0 0 14px rgba(255,122,217,.35)}
.cell.nodata{opacity:.6}
.tstats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--muted);font-size:13px}
.tstats b{color:var(--text)}

.match{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px}
.mtop{display:flex;gap:12px;align-items:center}
.num{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none}
.teams{flex:1;min-width:0}
.tn{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.tn .vs{color:var(--muted);font-weight:400;font-size:13px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tag.gem{color:var(--pink);border-color:var(--pink)}
.tag.nd{color:var(--yellow);border-color:var(--yellow)}
.forms{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.fm{display:inline-flex;gap:3px;vertical-align:middle}
.fm span{width:15px;height:15px;border-radius:4px;font-size:9px;display:grid;place-items:center;color:#04101f;font-weight:700}
.fm .G{background:var(--green)} .fm .E{background:var(--yellow)} .fm .P{background:var(--red)}
.pick{display:flex;gap:6px;flex:none;align-items:center}
.sign{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:26px;border:1px solid var(--line);background:var(--panel2)}
.sign.main.v1{background:rgba(61,255,139,.16);border-color:var(--green);color:var(--green)}
.sign.main.vX{background:rgba(255,210,63,.16);border-color:var(--yellow);color:var(--yellow)}
.sign.main.v2{background:rgba(76,201,255,.16);border-color:var(--blue);color:var(--blue)}
.sign.alt{width:34px;height:34px;font-size:19px;opacity:.75;border-style:dashed}
.match.nodata .sign.main{opacity:.5;border-style:dashed}
.bar{display:flex;height:26px;border-radius:9px;overflow:hidden;margin:12px 0 4px;font-size:12px;font-weight:700;color:#04101f}
.bar div{display:grid;place-items:center;min-width:0;transition:width .5s}
.bar .b1{background:var(--green)} .bar .bX{background:var(--yellow)} .bar .b2{background:var(--blue)}
.reason{font-size:14px;color:#cfd7f7;margin:6px 0 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;min-height:36px}
.grid2{display:grid;grid-template-columns:1fr;gap:6px 24px;font-size:13px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv span{color:var(--muted)}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
.list li{padding:3px 0;color:#cfd7f7}
.list .out{color:var(--red)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.pleno{text-align:center}
.pleno .score{font-size:64px;color:var(--yellow);line-height:1}
.note{color:var(--muted);font-size:13px;margin:4px 0}
.err{background:#3a1020;border:1px solid var(--red);padding:16px;border-radius:12px;margin:20px 0}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
.skel{height:84px;border-radius:16px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
button.reload{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;min-height:44px}
button.gen{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;min-height:56px;font:inherit;font-weight:700;font-size:18px;color:#04101f;cursor:pointer;background:linear-gradient(90deg,var(--green),var(--blue));box-shadow:0 0 26px rgba(61,255,139,.3)}
button.gen:active{transform:scale(.99)}
.seg.lv{margin:12px 0 0;max-width:none}
html,body{overscroll-behavior-y:contain}
#pull{position:fixed;top:0;left:0;right:0;text-align:center;padding:16px;background:var(--panel2);border-bottom:1px solid var(--green);color:var(--green);font-weight:700;transform:translateY(-70px);opacity:0;z-index:50;pointer-events:none;transition:transform .2s,opacity .2s}
#install{margin-top:14px;padding:12px 22px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font-weight:700;font-size:15px;cursor:pointer}
.pub{font-size:12px;color:var(--muted);margin:0 0 2px}
.pub b{color:var(--text);font-weight:500}
.tag.q{color:var(--blue);border-color:var(--blue)}
button.slipbtn{display:block;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;min-height:48px;font:inherit;font-weight:700;color:var(--text);background:var(--panel2);cursor:pointer}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.rec div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rec b{font-size:26px;line-height:1.1;display:block}
.rec small{color:var(--muted);font-size:12px}
#slip{position:fixed;inset:0;z-index:80;background:#f7f4ea;color:#111;display:flex;flex-direction:column;padding:10px 14px;overflow:auto}
#slip header{display:flex;align-items:center;justify-content:space-between;padding:0 0 6px;text-align:left}
#slip h2{margin:0;font-size:clamp(20px,3.4vh,34px);color:#b3001b}
#slip .x{border:2px solid #111;background:#fff;color:#111;border-radius:10px;font:inherit;font-weight:700;padding:8px 16px;min-height:44px;cursor:pointer}
#slip .rows{flex:1;display:grid;grid-template-rows:repeat(15,minmax(0,1fr));gap:3px;min-height:420px}
#slip .row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid #d9d2bd;font-size:clamp(13px,min(2.7vh,4.1vw),26px)}
#slip .row .n{font-weight:700;color:#b3001b;text-align:right}
#slip .row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
#slip .bx{display:flex;gap:clamp(3px,.8vw,6px)}
#slip .bx span{width:1.9em;height:1.5em;border:2px solid #b3001b;border-radius:5px;display:grid;place-items:center;color:#b3001b;font-weight:700;font-size:.85em;background:#fff}
#slip .bx span.on{background:#111;border-color:#111;color:#fff}
#slip .bx span.alt{border-style:dashed;background:#ffe9a8}
#slip .bx i{font-style:normal;font-size:.7em;align-self:center;color:#555;margin:0 2px}
#slip .ft{font-size:13px;color:#555;padding-top:6px}
#lock{max-width:380px;margin:40px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
#lock input{width:100%;font:inherit;font-size:28px;text-align:center;letter-spacing:.3em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:14px 0 4px}
#lock .bad{color:var(--red);font-size:14px;min-height:20px}
@media print{body{background:#fff;color:#000}.seg,.seghint,button.reload{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="pill"><span class="dot"></span>Estanco Nº5 · Águilas</div>
    <h1 class="display">QUINIELA <span>IA</span></h1>
    <div class="sub" id="sub">Cargando pronóstico…</div>
    <button id="install" hidden>📲 Instalar app</button>
  </header>
  <div id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <footer id="foot"></footer>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
let DATA = null, MODE = "safe";
try { MODE = localStorage.getItem("qia-mode") || "safe"; if (MODE === "mix") MODE = "safe"; } catch {}

const ago = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 2) return "hace un momento";
  if (m < 90) return `hace ${m} min`;
  const hh = Math.round(m / 60);
  return hh < 36 ? `hace ${hh} h` : `hace ${Math.round(hh / 24)} días`;
};
const fmtPct = (x) => (x >= 1 ? x.toFixed(1).replace(".", ",") + " %" : x > 0 ? "1 entre " + Math.round(100 / x).toLocaleString("es-ES") : "—");
const form = (arr) => h("span", { class: "fm" }, (arr || []).map((x) => h("span", { class: x, text: x })));
const signOf = (m) => (MODE === "mix" && MIX ? MIX.signs[DATA.matches.indexOf(m)] : MODE === "value" && m.valuePick ? m.surprise.sign : m.pick);


/* ───────── Combinación nueva (cada pulsación cambia algunos signos, nunca repite) ───────── */
const LEVELS = { suave: [1, 2], normal: [2, 4], atrevido: [4, 6] };
let LEVEL = "normal", MIX = null, SEEN = new Set(), COUNT = 0;
try { LEVEL = localStorage.getItem("qia-level") || "normal"; } catch {}
const rnd = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; };
const randInt = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
const pk = (m, s) => m.probs[s === "1" ? "p1" : s === "X" ? "px" : "p2"] / 100;
const val = (m, s) => { const k = s === "1" ? "p1" : s === "X" ? "px" : "p2"; return m.publicPct ? m.probs[k] / Math.max(2, m.publicPct[k]) : 1; };
function weighted(items, w) { // elige 1 índice según pesos
  const t = w.reduce((a, b) => a + b, 0); let r = rnd() * t;
  for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return i; }
  return items.length - 1;
}
function poisson(l, max = 6) { const p = [Math.exp(-l)]; for (let i = 1; i <= max; i++) p.push(p[i - 1] * l / i); return p; }
function plenoCandidates(p) {
  const c = {};
  if (p.dist) { // distribución de goles (0,1,2,M) de cada equipo según las cuotas
    const G = ["0", "1", "2", "M"];
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) c[`${G[i]}-${G[j]}`] = p.dist.h[i] * p.dist.a[j];
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }
  let lh = p.covered ? p.xgHome : 1.4, la = p.covered ? p.xgAway : 1.1;
  const ph = poisson(lh), pa = poisson(la);
  for (let i = 0; i <= 6; i++) for (let j = 0; j <= 6; j++) {
    const k = `${Math.min(i, 3) === 3 ? "M" : i}-${Math.min(j, 3) === 3 ? "M" : j}`;
    c[k] = (c[k] || 0) + ph[i] * pa[j];
  }
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5);
}
function buildCombo() {
  const ms = DATA.matches;
  const signs = ms.map((m) => m.pick);
  const [lo, hi] = LEVELS[LEVEL];
  const k = randInt(lo, hi);
  const pool = ms.map((_, i) => i);
  const flips = [];
  for (let n = 0; n < k && pool.length; n++) {
    const w = pool.map((i) => { const m = ms[i]; return Math.max(...["1", "X", "2"].filter((x) => x !== m.pick).map((x) => pk(m, x))) ** 1.5; });
    const idx = weighted(pool, w), i = pool.splice(idx, 1)[0], m = ms[i];
    const alts = ["1", "X", "2"].filter((x) => x !== m.pick);
    // entre los otros dos signos, pesa más el que tiene probabilidad real y juega poca gente
    signs[i] = alts[weighted(alts, alts.map((x) => pk(m, x) * Math.min(2, Math.max(0.6, val(m, x)))))];
    flips.push(m.n);
  }
  const cand = plenoCandidates(DATA.pleno15);
  const top = LEVEL === "suave" ? cand.slice(0, 2) : LEVEL === "normal" ? cand.slice(0, 3) : cand;
  const [score] = top[weighted(top, top.map((x) => x[1]))];
  const [ph, pa] = score.split("-");
  const cov = ms.filter((m) => m.priced);
  return {
    signs, flips, pleno: { h: ph, a: pa },
    expectedHits: +cov.reduce((t, m) => t + pk(m, signs[ms.indexOf(m)]), 0).toFixed(1),
    pAll: +(100 * cov.reduce((t, m) => t * pk(m, signs[ms.indexOf(m)]), 1)).toFixed(6),
  };
}
function generate() {
  let c, tries = 0;
  do { c = buildCombo(); tries++; } while (SEEN.has(c.signs.join("") + c.pleno.h + c.pleno.a) && tries < 80);
  SEEN.add(c.signs.join("") + c.pleno.h + c.pleno.a);
  COUNT++; MIX = c; MODE = "mix"; render();
  document.querySelector("#mixcard")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function setLevel(l) { LEVEL = l; try { localStorage.setItem("qia-level", l); } catch {} render(); }

function mixCard() {
  const lv = (k, t) => h("button", { "aria-pressed": String(LEVEL === k), onclick: `setLevel('${k}')`, text: t });
  const kids = [
    h("h2", { class: "display", text: "🎲 Tu combinación" }),
    h("p", { class: "note", text: "Parte del boleto seguro y cambia unos pocos partidos, más fácil en los más abiertos. Cada vez que pulsas, o deslizas el dedo hacia abajo en la pantalla, sale una combinación distinta." }),
    h("div", { class: "seg lv", role: "group", "aria-label": "Cuántos cambios" },
      lv("suave", "Pocos cambios"), lv("normal", "Normal"), lv("atrevido", "Atrevida")),
    h("button", { class: "gen", onclick: "generate()", text: MIX ? "🎲 Otra combinación" : "🎲 Generar combinación" }),
  ];
  if (MIX) {
    const cells = DATA.matches.map((m, i) => h("div", { class: `cell s${MIX.signs[i]}${MIX.flips.includes(m.n) ? " gem" : ""}${m.priced ? "" : " nodata"}`, title: `${m.home} - ${m.away}` },
      h("i", { text: m.n }), h("b", { class: "display", text: MIX.signs[i] }), MIX.flips.includes(m.n) ? h("em", { text: "cambia" }) : null));
    cells.push(h("div", { class: "cell" }, h("i", { text: 15 }), h("b", { class: "display", style: "font-size:20px", text: `${MIX.pleno.h}-${MIX.pleno.a}` })));
    kids.push(h("div", { class: "cells", style: "margin-top:14px" }, cells),
      h("div", { class: "tstats" },
        h("span", {}, "Combinación nº ", h("b", { text: COUNT })),
        h("span", {}, "Cambios respecto al seguro: ", h("b", { text: MIX.flips.length })),
        h("span", {}, "Aciertos esperados: ", h("b", { text: MIX.expectedHits })),
        h("span", {}, "Prob. de acertar todos: ", h("b", { text: fmtPct(MIX.pAll) }))),
      h("button", { class: "slipbtn", onclick: "showSlip('mix')", text: "🎫 Ver boleto en grande" }));
  }
  return h("div", { class: "ticket", id: "mixcard" }, kids);
}

function ticketCard(t, title, desc, mode) {
  const cells = DATA.matches.map((m, i) => {
    const s = t.signs[i];
    const gem = t.surprises.includes(m.n);
    return h("div", { class: `cell s${s}${gem ? " gem" : ""}${m.priced ? "" : " nodata"}`, title: `${m.home} - ${m.away}` },
      h("i", { text: m.n }), h("b", { class: "display", text: s }),
      m.advice === "doble" && m.alt && !gem ? h("em", { text: `o ${m.alt}` }) : gem ? h("em", { text: "💎" }) : null);
  });
  const p = DATA.pleno15;
  cells.push(h("div", { class: "cell", title: "Pleno al 15" }, h("i", { text: 15 }), h("b", { class: "display", style: "font-size:20px", text: `${p.homeGoals}-${p.awayGoals}` })));
  return h("div", { class: "ticket" },
    h("h2", { class: "display", text: title }), h("p", { class: "note", text: desc }),
    h("div", { class: "cells" }, cells),
    h("div", { class: "tstats" },
      h("span", {}, "Aciertos esperados: ", h("b", { text: t.expectedHits })),
      h("span", {}, "Probabilidad de acertar todos: ", h("b", { text: fmtPct(t.pAll) }))),
    h("button", { class: "slipbtn", onclick: `showSlip('${mode}')`, text: "🎫 Ver boleto en grande" }));
}

/* ───────── Boleto en grande (para enseñarlo en el mostrador y validarlo rápido) ───────── */
function showSlip(mode) {
  const d = DATA, ms = d.matches;
  const signs = mode === "mix" && MIX ? MIX.signs : mode === "value" ? d.ticketValue.signs : d.ticketSafe.signs;
  const pleno = mode === "mix" && MIX ? MIX.pleno : { h: d.pleno15.homeGoals, a: d.pleno15.awayGoals };
  const title = mode === "mix" ? `Mi combinación nº ${COUNT}` : mode === "value" ? "Boleto con sorpresas" : "Boleto seguro";
  const rows = ms.map((m, i) => h("div", { class: "row" },
    h("span", { class: "n", text: m.n }), h("span", { class: "t", text: `${m.home} - ${m.away}` }),
    h("span", { class: "bx" }, ["1", "X", "2"].map((s) => h("span", { class: s === signs[i] ? "on" : mode === "safe" && m.advice === "doble" && m.alt === s ? "alt" : "", text: s })))));
  const g = (v) => ["0", "1", "2", "M"].map((s) => h("span", { class: s === v ? "on" : "", text: s }));
  rows.push(h("div", { class: "row" }, h("span", { class: "n", text: 15 }), h("span", { class: "t", text: `${d.pleno15.home} - ${d.pleno15.away}` }),
    h("span", { class: "bx" }, g(pleno.h), h("i", { text: "–" }), g(pleno.a))));
  const el = h("div", { id: "slip", role: "dialog", "aria-label": title },
    h("header", {}, h("h2", { text: `QUINIELA · ${d.jornada} · ${title}` }), h("button", { class: "x", onclick: "closeSlip()", text: "✕ Cerrar" })),
    h("div", { class: "rows" }, rows),
    h("div", { class: "ft", text: (mode === "safe" && d.columns > 1 ? `En amarillo, el segundo signo si se juegan dobles (${d.columns} columnas). ` : "") + "Signos: " + signs.join(" ") + ` · Pleno al 15: ${pleno.h}-${pleno.a}` }));
  closeSlip(); document.body.append(el);
}
function closeSlip() { document.getElementById("slip")?.remove(); }
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSlip(); });

/* ───────── Marcador de aciertos ───────── */
function recordCard() {
  const r = DATA.record || { entries: [] };
  const kids = [h("h2", { class: "display", text: "📊 Marcador de aciertos" })];
  if (r.entries.length) {
    kids.push(h("p", { class: "note", text: "Aciertos del boleto seguro en las jornadas ya jugadas (el boleto se guarda antes del cierre de apuestas)." }));
    kids.push(h("div", { class: "rec" }, r.entries.slice().reverse().map((e) => h("div", {},
      h("small", { text: `Jornada ${e.j}` }), h("b", { class: "display", text: `${e.hitsSafe} de ${e.played}` }),
      h("small", { text: `con sorpresas: ${e.hitsValue}` + (e.plenoHit ? " · ⭐ pleno al 15" : "") })))));
    const n = r.entries.reduce((a, e) => a + e.played, 0), hits = r.entries.reduce((a, e) => a + e.hitsSafe, 0);
    kids.push(h("p", { class: "note", text: `Total: ${hits} aciertos de ${n} partidos (${Math.round(100 * hits / n)} %).` }));
  } else kids.push(h("p", { class: "note", text: `El marcador empieza a contar con la ${DATA.jornada.toLowerCase()}: cuando se juegue, aquí saldrán los aciertos.` }));
  if (r.sim) kids.push(h("p", { class: "note", text: `Prueba con las jornadas ${r.sim.from}–${r.sim.to} de esta temporada (simulación, no boletos jugados): media de ${String(r.sim.avg).replace(".", ",")} aciertos de 14; la mejor jornada ${r.sim.best} y la peor ${r.sim.worst}.` }));
  return h("div", { class: "sec" }, kids);
}

function matchCard(m) {
  const sgn = signOf(m);
  const bar = h("div", { class: "bar", role: "img", "aria-label": `1: ${m.probs.p1}%, X: ${m.probs.px}%, 2: ${m.probs.p2}%` },
    [["1", m.probs.p1], ["X", m.probs.px], ["2", m.probs.p2]].map(([k, v]) => h("div", { class: `b${k}`, style: `width:${v}%`, text: v >= 9 ? `${k} ${v}%` : "" })));
  const showAlt = MODE === "safe" && m.advice === "doble" && m.alt;
  const det = [];
  const p3 = (p) => `1 ${p.p1}% · X ${p.px}% · 2 ${p.p2}%`;
  const pubName = m.publicSrc === "lae" ? "Juega la gente" : m.publicSrc === "quinielista" ? "Juegan los quinielistas" : "Juega la gente (estimado)";
  if (m.marketProbs || m.modelProbs) det.push(h("div", { class: "grid2" },
    m.marketProbs ? h("div", { class: "kv" }, h("span", { text: "Casas de apuestas" }), h("b", { text: p3(m.marketProbs) })) : null,
    m.modelProbs ? h("div", { class: "kv" }, h("span", { text: "Nuestras estadísticas" }), h("b", { text: p3(m.modelProbs) })) : null));
  if (m.surprise) {
    const k = m.surprise.sign === "1" ? "p1" : m.surprise.sign === "X" ? "px" : "p2";
    det.push(h("p", { class: "note" }, `💎 Sorpresa posible: el ${m.surprise.sign} tiene ${Math.round(m.surprise.prob * 100)}% de probabilidad real y ` +
      (m.publicPct ? `lo juega el ${m.publicPct[k]}% de la gente${m.publicSrc === "estimado" ? " (estimación)" : ""}.` : "lo juega poca gente.")));
  }
  if (m.covered) {
    det.push(h("div", { class: "grid2" },
      h("div", { class: "kv" }, h("span", { text: "Goles esperados" }), h("b", { text: `${m.xgHome} - ${m.xgAway}` })),
      h("div", { class: "kv" }, h("span", { text: "Marcador más probable" }), h("b", { text: m.likelyScore })),
      h("div", { class: "kv" }, h("span", { text: "Más de 2,5 goles" }), h("b", { text: `${m.over25}%` })),
      h("div", { class: "kv" }, h("span", { text: "Marcan los dos" }), h("b", { text: `${m.btts}%` }))));
    if (m.scorers.length) det.push(h("ul", { class: "list" }, m.scorers.map((s) =>
      h("li", { class: s.out ? "out" : "" },
        s.tag === "racha" ? "🔥 " : s.tag === "sequia" ? "🧊 " : "⚽ ",
        h("b", { text: s.player }), ` (${s.team})`,
        s.out ? ` · no juega: ${s.out}` : ` · ${s.note || `${s.goals} goles esta temporada`} · marca ~${s.chance}%`))));
    if (m.news && m.news.length) det.push(h("ul", { class: "list" }, m.news.map((n) => h("li", { text: `📰 ${n.src}: ${n.title}` }))));
    if (m.absences.length) det.push(h("ul", { class: "list" }, m.absences.map((a) => h("li", { text: `🚑 ${a.player} (${a.team}) — ${a.reason}` }))));
  }
  return h("div", { class: "match" + (m.priced ? "" : " nodata") },
    h("div", { class: "mtop" },
      h("div", { class: "num mono", text: m.n }),
      h("div", { class: "teams" },
        h("div", { class: "tn" }, m.home, h("span", { class: "vs", text: "vs" }), m.away,
          m.covered ? h("span", { class: "tag", text: m.league === "laliga" ? "1ª" : "2ª" }) : m.priced ? h("span", { class: "tag q", text: "cuotas" }) : h("span", { class: "tag nd", text: "sin datos" }),
          MODE === "value" && m.valuePick ? h("span", { class: "tag gem", text: "💎 sorpresa" }) : null,
          MODE === "mix" && MIX && MIX.flips.includes(m.n) ? h("span", { class: "tag gem", text: "cambia" }) : null),
        m.covered ? h("div", { class: "forms" },
          h("span", {}, `${m.posHome}º `, form(m.formHome)), h("span", {}, `${m.posAway}º `, form(m.formAway))) : null),
      h("div", { class: "pick" },
        h("div", { class: `sign main v${sgn} display`, text: sgn }),
        showAlt ? h("div", { class: "sign alt display", title: "segundo signo", text: m.alt }) : null)),
    bar,
    m.publicPct ? h("p", { class: "pub" }, `👥 ${pubName}: `, h("b", { text: p3(m.publicPct) })) : null,
    h("p", { class: "reason", text: m.reasoning }),
    det.length ? h("details", {}, h("summary", { text: "Ver más datos" }), det) : null);
}

function render() {
  const d = DATA, app = $("#app");
  $("#sub").textContent = `${d.jornada} · actualizado ${ago(d.generatedAt)}`;
  const kids = [];
  kids.push(h("div", { class: "meta" },
    h("div", { class: "chip" }, h("b", { class: "display", text: d.jornada.replace("Jornada ", "J") }), h("small", { text: "Jornada" })),
    h("div", { class: "chip" }, h("b", { class: "display", text: `${d.distribution.ones}·${d.distribution.xs}·${d.distribution.twos}` }), h("small", { text: "1 · X · 2" })),
    h("div", { class: "chip" }, h("b", { class: "display", text: `${d.confidence}%` }), h("small", { text: "Confianza media" })),
    h("div", { class: "chip" }, h("b", { class: "display", text: d.columns }), h("small", { text: d.columns === 1 ? "Columna" : "Columnas con dobles" }))));
  kids.push(mixCard());
  kids.push(ticketCard(d.ticketSafe, "Boleto seguro", "El signo más probable de cada partido. Los dobles (segundo signo) solo en los partidos más abiertos.", "safe"));
  kids.push(ticketCard(d.ticketValue, "Boleto con sorpresas 💎",
    "Cambia 2-3 partidos por un signo que juega poca gente pero con probabilidad real. Es más difícil de acertar, pero si entra, el premio se reparte entre menos acertantes.", "value"));
  kids.push(h("div", { class: "seg", role: "group", "aria-label": "Qué boleto ver en la lista" },
    h("button", { "aria-pressed": String(MODE === "safe"), onclick: "setMode('safe')", text: "Boleto seguro" }),
    h("button", { "aria-pressed": String(MODE === "value"), onclick: "setMode('value')", text: "Sorpresas 💎" }),
    h("button", { "aria-pressed": String(MODE === "mix"), onclick: "setMode('mix')", text: "Mi combinación 🎲" })));
  kids.push(h("p", { class: "seghint", text: "Las barras muestran la probabilidad real de 1, X y 2 (cuotas de las casas de apuestas y estadísticas propias). Debajo, lo que está jugando la gente. Toca «Ver más datos» para goles esperados, goleadores y bajas." }));
  kids.push(...d.matches.map(matchCard));
  const p = d.pleno15;
  kids.push(h("div", { class: "sec pleno" }, h("h2", { class: "display", text: "⭐ Pleno al 15" }),
    h("div", { class: "note", text: `${p.home} vs ${p.away}` }),
    h("div", { class: "score display", text: `${p.homeGoals} - ${p.awayGoals}` }),
    h("p", { class: "note", text: p.reasoning })));
  kids.push(recordCard());
  kids.push(h("div", { class: "sec" }, h("h2", { class: "display", text: "🧠 Análisis" }), h("p", { text: d.analysis }),
    ...d.notes.map((n) => h("p", { class: "note", text: "ℹ️ " + n }))));
  app.replaceChildren(...kids);
  $("#foot").replaceChildren(
    h("div", {}, "Cuotas de las casas de apuestas + modelo estadístico propio (goles, ventaja de campo, rachas, bajas y goleadores) · "
      + (d.aiUsed ? `redacción con ${d.aiUsed}` : "redacción automática")),
    h("div", {}, `Fuentes: ${d.source}`),
    h("div", {}, "En las 20 jornadas anteriores de esta temporada, el signo más probable acertó ~59 % de los partidos. ",
      "Aun así la Quiniela es un juego de azar: solo orientativo. Juega con responsabilidad. +18."),
    h("div", {}, "Estanco Nº5 · Calle Libertad 22 · Águilas"),
    h("button", { class: "reload", onclick: "load(true)", text: "↻ Actualizar" }));
}
function setMode(m) { if (m === "mix" && !MIX) { generate(); return; } MODE = m; try { localStorage.setItem("qia-mode", m); } catch {} render(); }

/* ───────── PIN por aparato ─────────
 * La primera vez que se abre en un aparato pide el PIN del estanco; después ese aparato queda autorizado.
 * Es un freno para que no se use fuera del estanco, no una caja fuerte: la web es pública. */
const PIN_HASH = "b1fa909ff1f297632790bac2377514f824251300b35612a716c2f819718fb695", PIN_SALT = "qia-estanco5:";
const sha = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((b) => b.toString(16).padStart(2, "0")).join("");
const allowed = () => { try { return localStorage.getItem("qia-ok") === PIN_HASH; } catch { return false; } };
function lockScreen() {
  $("#sub").textContent = "Aparato no autorizado";
  const inp = h("input", { type: "password", inputmode: "numeric", autocomplete: "off", maxlength: "12", "aria-label": "PIN" });
  const bad = h("div", { class: "bad", role: "alert" });
  const go = async () => {
    if ((await sha(PIN_SALT + inp.value.trim())) === PIN_HASH) { try { localStorage.setItem("qia-ok", PIN_HASH); } catch {} load(false); }
    else { bad.textContent = "PIN incorrecto"; inp.value = ""; inp.focus(); }
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  const btn = h("button", { class: "gen", text: "Entrar" }); btn.addEventListener("click", go);
  $("#app").replaceChildren(h("div", { id: "lock" }, h("h2", { class: "display", text: "🔒 Solo para el estanco" }),
    h("p", { class: "note", text: "Escribe el PIN para usar la Quiniela IA en este aparato. Solo se pide una vez." }), inp, bad, btn));
  $("#foot").replaceChildren(h("div", {}, "Estanco Nº5 · Calle Libertad 22 · Águilas"));
}

async function load(force) {
  if (!allowed()) { DATA = null; lockScreen(); return; }
  try {
    const r = await fetch(`quiniela.json?t=${force ? Date.now() : Math.floor(Date.now() / 300000)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    DATA = await r.json();
    render();
  } catch (e) {
    $("#app").replaceChildren(h("div", { class: "err" }, h("b", { text: "No se ha podido cargar el pronóstico. " }), `(${e.message}) Comprueba la conexión e inténtalo de nuevo.`,
      h("div", {}, h("button", { class: "reload", onclick: "load(true)", text: "Reintentar" }))));
    $("#sub").textContent = "Sin datos";
  }
}

/* ───────── Deslizar hacia abajo = otra combinación (como en la versión anterior) ───────── */
(() => {
  let y0 = null, dy = 0;
  const bar = h("div", { id: "pull", text: "↓ Desliza para otra combinación" });
  document.body.append(bar);
  const reset = () => { bar.style.transition = "transform .2s,opacity .2s"; bar.style.transform = "translateY(-70px)"; bar.style.opacity = 0; };
  addEventListener("touchstart", (e) => { y0 = scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    if (scrollY > 0) { y0 = null; reset(); return; }
    dy = Math.max(0, e.touches[0].clientY - y0);
    bar.style.transition = "none";
    bar.style.transform = `translateY(${Math.min(dy, 110) - 70}px)`;
    bar.style.opacity = Math.min(1, dy / 60);
    bar.textContent = dy > 90 ? "↑ Suelta para otra combinación" : "↓ Desliza para otra combinación";
  }, { passive: true });
  addEventListener("touchend", () => { const go = y0 != null && dy > 90 && DATA; y0 = null; dy = 0; reset(); if (go) generate(); });
})();
load(false);
setInterval(() => DATA && ($("#sub").textContent = `${DATA.jornada} · actualizado ${ago(DATA.generatedAt)}`), 60000);
/* ───────── Botón "Instalar app" (solo aparece si el navegador lo permite y aún no está instalada) ───────── */
(() => {
  const btn = document.getElementById("install");
  let ev = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ev = e; btn.hidden = false; });
  btn.addEventListener("click", async () => { if (!ev) return; ev.prompt(); await ev.userChoice.catch(() => {}); ev = null; btn.hidden = true; });
  addEventListener("appinstalled", () => { btn.hidden = true; });
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
